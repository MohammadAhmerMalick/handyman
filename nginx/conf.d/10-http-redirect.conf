# Port 80 after HTTPS is enabled (copied to 10-http.conf by enable-docker-ssl.sh).

server {
  listen 80;
  listen [::]:80;

  server_name beiruttobeirut.uroojperfumes.com;

  server_tokens off;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}
