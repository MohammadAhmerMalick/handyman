location /_next/static {
  proxy_cache STATIC;
  proxy_pass http://nextjs_upstream;
  add_header X-Cache-Status $upstream_cache_status;
}

location /static {
  proxy_cache STATIC;
  proxy_ignore_headers Cache-Control;
  proxy_cache_valid 60m;
  proxy_pass http://nextjs_upstream;
  add_header X-Cache-Status $upstream_cache_status;
}

location / {
  proxy_pass http://nextjs_upstream;
}
